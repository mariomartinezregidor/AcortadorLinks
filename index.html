<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descargador de enlaces</title>
<style>
  :root {
    --fondo: #12141a;
    --panel: #1b1f29;
    --borde: #2b3140;
    --texto: #e6e9f0;
    --suave: #9aa3b5;
    --acento: #4f8cff;
    --ok: #37c871;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fondo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  main { width: 100%; max-width: 820px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--suave); margin: 0 0 24px; font-size: .9rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
  }
  label { display: block; font-size: .85rem; color: var(--suave); margin-bottom: 8px; }
  textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    background: #0e1015;
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 12px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: .85rem;
    line-height: 1.5;
  }
  textarea:focus { outline: 1px solid var(--acento); }
  .fila { display: flex; gap: 10px; align-items: center; }
  .fila + .fila { margin-top: 14px; }
  input[type="text"] {
    flex: 1;
    background: #0e1015;
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: .85rem;
  }
  button {
    border: 1px solid var(--borde);
    background: #232937;
    color: var(--texto);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: .88rem;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--acento); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.principal {
    background: var(--acento);
    border-color: var(--acento);
    color: #fff;
    font-weight: 600;
    width: 100%;
    padding: 13px;
    margin-top: 16px;
  }
  button.peligro { border-color: var(--error); color: var(--error); }
  .opciones { margin-top: 14px; font-size: .85rem; color: var(--suave); }
  .opciones label { display: inline-flex; align-items: center; gap: 8px; margin: 0; }
  .barra {
    height: 14px;
    background: #0e1015;
    border: 1px solid var(--borde);
    border-radius: 999px;
    overflow: hidden;
  }
  .barra > div {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #3a6fd8, var(--acento));
    transition: width .25s ease;
  }
  .barra.indeterminada > div {
    width: 35% !important;
    animation: deslizar 1.1s infinite linear;
  }
  @keyframes deslizar {
    from { transform: translateX(-120%); }
    to { transform: translateX(320%); }
  }
  .meta { display: flex; justify-content: space-between; font-size: .8rem; color: var(--suave); margin: 6px 0 16px; }
  .log {
    margin-top: 14px;
    max-height: 240px;
    overflow: auto;
    background: #0e1015;
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 12px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: .78rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--suave);
  }
  .aviso { font-size: .85rem; margin-top: 12px; }
  .aviso.ok { color: var(--ok); }
  .aviso.error { color: var(--error); }
  .oculto { display: none; }
</style>
</head>
<body>
<main>
  <h1>Descargador de enlaces</h1>
  <p class="sub">Pega los enlaces, elige la carpeta del PC y pulsa Descargar.</p>

  <section class="panel">
    <label for="enlaces">Enlaces (uno por línea)</label>
    <textarea id="enlaces" placeholder="https://softurl.in/XXXX&#10;https://web-api-13.vercel.app/?url=https://softurl.in/YYYY"></textarea>

    <div class="fila" style="margin-top:14px">
      <input type="text" id="carpeta" placeholder="Carpeta de destino" readonly>
      <button id="btnCarpeta" type="button">Seleccionar carpeta</button>
    </div>

    <div class="opciones">
      <label><input type="checkbox" id="force"> Sobrescribir archivos existentes</label>
    </div>

    <button class="principal" id="btnDescargar" type="button">Descargar</button>
  </section>

  <section class="panel oculto" id="panelProgreso">
    <div class="meta">
      <span id="textoEnlaces">0/0 enlaces</span>
      <span id="textoEstado">Preparando…</span>
    </div>
    <div class="barra" id="barraGlobal"><div id="progresoGlobal"></div></div>

    <div class="meta" style="margin-top:16px">
      <span id="textoArchivo">Archivo actual: —</span>
      <span id="textoBytes"></span>
    </div>
    <div class="barra" id="barraArchivo"><div id="progresoArchivo"></div></div>

    <div class="log" id="log"></div>
    <div class="fila" style="margin-top:14px">
      <button id="btnCancelar" class="peligro" type="button">Cancelar</button>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let jobId = null;
let temporizador = null;

function humanBytes(n) {
  if (!n) return "0 B";
  const unidades = ["B", "KB", "MB", "GB"];
  let i = 0, v = n;
  while (v >= 1024 && i < unidades.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(i === 0 ? 0 : 1)} ${unidades[i]}`;
}

function aviso(mensaje, tipo) {
  const caja = $("log");
  caja.textContent = mensaje;
  caja.style.color = tipo === "error" ? "var(--error)" : "var(--suave)";
}

$("btnCarpeta").addEventListener("click", async () => {
  $("btnCarpeta").disabled = true;
  try {
    const r = await fetch("/api/carpeta", { method: "POST", body: "{}" });
    const datos = await r.json();
    if (!r.ok || datos.error) { alert(datos.error || "No se pudo elegir la carpeta."); return; }
    if (datos.carpeta) $("carpeta").value = datos.carpeta;
  } catch (e) {
    alert("Error de conexión con el servidor local.");
  } finally {
    $("btnCarpeta").disabled = false;
  }
});

$("btnDescargar").addEventListener("click", async () => {
  const enlaces = $("enlaces").value.trim();
  const carpeta = $("carpeta").value.trim();
  if (!enlaces) { alert("Pega al menos un enlace."); return; }
  if (!carpeta) { alert("Selecciona una carpeta de destino."); return; }

  $("panelProgreso").classList.remove("oculto");
  $("log").style.color = "var(--suave)";
  $("log").textContent = "";
  $("btnDescargar").disabled = true;
  $("btnCancelar").disabled = false;
  $("barraGlobal").classList.add("indeterminada");
  $("barraArchivo").classList.add("indeterminada");
  $("progresoGlobal").style.width = "0%";
  $("progresoArchivo").style.width = "0%";
  $("textoEstado").textContent = "Iniciando…";

  try {
    const r = await fetch("/api/descargar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enlaces, carpeta, force: $("force").checked })
    });
    const datos = await r.json();
    if (!r.ok || datos.error) {
      $("textoEstado").textContent = "Error";
      aviso(datos.error || "No se pudo iniciar la descarga.", "error");
      $("btnDescargar").disabled = false;
      $("barraGlobal").classList.remove("indeterminada");
      $("barraArchivo").classList.remove("indeterminada");
      return;
    }
    jobId = datos.id;
    temporizador = setInterval(consultarEstado, 500);
  } catch (e) {
    $("textoEstado").textContent = "Error";
    aviso("No se pudo conectar con el servidor local.", "error");
    $("btnDescargar").disabled = false;
  }
});

$("btnCancelar").addEventListener("click", async () => {
  if (!jobId) return;
  await fetch("/api/cancelar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: jobId })
  });
  $("textoEstado").textContent = "Cancelando…";
});

async function consultarEstado() {
  if (!jobId) return;
  let datos;
  try {
    const r = await fetch(`/api/estado?id=${encodeURIComponent(jobId)}`);
    if (!r.ok) return;
    datos = await r.json();
  } catch (e) { return; }

  const terminado = datos.estado !== "en_curso";
  const pctGlobal = datos.total ? Math.round((datos.completados + datos.fallidos) / datos.total * 100) : 0;

  if (datos.completados + datos.fallidos > 0 || terminado) {
    $("barraGlobal").classList.remove("indeterminada");
    $("progresoGlobal").style.width = pctGlobal + "%";
  }
  $("textoEnlaces").textContent = `${datos.completados + datos.fallidos}/${datos.total} enlaces (${datos.completados} ok, ${datos.fallidos} error)`;

  if (datos.descargado > 0 && datos.total_bytes > 0) {
    $("barraArchivo").classList.remove("indeterminada");
    $("progresoArchivo").style.width = Math.min(100, Math.round(datos.descargado / datos.total_bytes * 100)) + "%";
  }
  $("textoArchivo").textContent = "Archivo actual: " + (datos.archivo || "—");
  $("textoBytes").textContent = datos.total_bytes
    ? `${humanBytes(datos.descargado)} / ${humanBytes(datos.total_bytes)}`
    : (datos.descargado ? humanBytes(datos.descargado) : "");

  $("log").textContent = datos.log.join("\n");
  $("log").scrollTop = $("log").scrollHeight;

  if (terminado) {
    clearInterval(temporizador);
    temporizador = null;
    $("barraGlobal").classList.remove("indeterminada");
    $("barraArchivo").classList.remove("indeterminada");
    $("btnDescargar").disabled = false;
    $("btnCancelar").disabled = true;
    const etiquetas = {
      terminado: "Completado",
      terminado_con_errores: "Completado con errores",
      cancelado: "Cancelado"
    };
    $("textoEstado").textContent = `${etiquetas[datos.estado] || datos.estado} · ${datos.transcurrido}s`;
    $("log").style.color = datos.fallidos ? "var(--error)" : "var(--ok)";
  } else {
    $("textoEstado").textContent = `Descargando ${datos.indice}/${datos.total} · ${datos.transcurrido}s`;
  }
}
</script>
</body>
</html>
